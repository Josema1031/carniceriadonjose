<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f0f0f0;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    input[type="text"], input[type="number"], input[type="password"] {
      width: 90%;
      padding: 5px;
    }
    button {
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
    }
    #acciones {
      text-align: center;
      margin-top: 20px;
    }
    #login-container {
      max-width: 300px;
      margin: 100px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    #admin-panel {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-container">
    <h2>Acceso al Panel de Control de Productos</h2>
    <input type="text" id="usuario" placeholder="Usuario"><br><br>
    <input type="password" id="clave" placeholder="Contraseña"><br><br>
    <button onclick="verificarLogin()">Ingresar</button>
    <p id="mensaje-error" style="color:red;"></p>
  </div>

  <!-- Panel oculto hasta que se loguee -->
  <div id="admin-panel">
    <h1>Panel de Administración de Productos</h1>
    <table id="tabla-productos">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Imagen (URL)</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="acciones">
  <button onclick="agregarProducto()">➕ Agregar Producto</button>
  <button onclick="guardarProductos()">💾 Guardar Cambios</button>
  <button onclick="cerrarSesion()" style="background-color: darkred; color: white;">🔒 Cerrar sesión</button>
</div>

  </div>

  <!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Tu configuración de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyA36uwBk0FBDc6rI16BAsqUNe_AXLpv62Q",
    authDomain: "carniceriadonjose-48638.firebaseapp.com",
    projectId: "carniceriadonjose-48638",
    storageBucket: "carniceriadonjose-48638.firebasestorage.app",
    messagingSenderId: "322531750471",
    appId: "1:322531750471:web:78e290c9c81eecc7be3762"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const productosRef = collection(db, "productos");

  let productos = [];

  // AUTENTICACIÓN LOCAL SIMPLE
  const USUARIO_CORRECTO = "admin";
  const CLAVE_CORRECTA = "1234";

  window.verificarLogin = async function () {
    const usuario = document.getElementById("usuario").value;
    const clave = document.getElementById("clave").value;
    const error = document.getElementById("mensaje-error");

    if (usuario === USUARIO_CORRECTO && clave === CLAVE_CORRECTA) {
      sessionStorage.setItem("accesoPermitido", "true");
      sessionStorage.setItem("horaLogin", Date.now());

      document.getElementById("login-container").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      await mostrarProductos();
    } else {
      error.textContent = "Usuario o contraseña incorrectos";
    }
  };

  async function mostrarProductos() {
  const snapshot = await getDocs(productosRef);
  productos = snapshot.docs.map(docSnap => ({
    id: docSnap.id,
    ...docSnap.data()
  }));
  renderTabla();
}


  window.editar = function (index, campo, valor) {
    productos[index][campo] = campo === 'precio' ? parseFloat(valor) : valor;
  };

 window.agregarProducto = function () {
  productos.push({ nombre: "", precio: 0, imagen: "", id: null });
  renderTabla();
}; 



function renderTabla() {
  const tbody = document.querySelector("#tabla-productos tbody");
  tbody.innerHTML = "";

  productos.forEach((prod, index) => {
    const fila = document.createElement("tr");
    fila.innerHTML = `
      <td><input type="text" value="${prod.nombre}" onchange="editar(${index}, 'nombre', this.value)"></td>
      <td><input type="number" value="${prod.precio}" onchange="editar(${index}, 'precio', this.value)"></td>
      <td><input type="text" value="${prod.imagen}" onchange="editar(${index}, 'imagen', this.value)"></td>
      <td>
        <button onclick="eliminarProducto('${prod.id}', ${index})">🗑️ Eliminar</button>
      </td>
    `;
    tbody.appendChild(fila);
  });
}


  window.eliminarProducto = async function (id) {
    if (confirm("¿Estás seguro de eliminar este producto?")) {
      await deleteDoc(doc(db, "productos", id));
      await mostrarProductos();
    }
  };

  window.guardarProductos = async function () {
    for (const prod of productos) {
      if (prod.id) {
        // Ya existe en la base, actualizamos
        const ref = doc(db, "productos", prod.id);
        await updateDoc(ref, {
          nombre: prod.nombre,
          precio: prod.precio,
          imagen: prod.imagen
        });
      } else {
        // Producto nuevo
        await addDoc(productosRef, {
          nombre: prod.nombre,
          precio: prod.precio,
          imagen: prod.imagen
        });
      }
    }
    alert("✅ Productos guardados correctamente.");
    await mostrarProductos();
  };

  window.onload = async function () {
    const acceso = sessionStorage.getItem("accesoPermitido");
    const horaLogin = sessionStorage.getItem("horaLogin");

    if (acceso === "true" && horaLogin) {
      const ahora = Date.now();
      const diferenciaMinutos = (ahora - parseInt(horaLogin)) / 60000;

      if (diferenciaMinutos <= 15) {
        document.getElementById("login-container").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        await mostrarProductos();
      } else {
        sessionStorage.removeItem("accesoPermitido");
        sessionStorage.removeItem("horaLogin");
        alert("Tu sesión ha caducado. Iniciá sesión nuevamente.");
      }
    }
  };

  window.cerrarSesion = function () {
    sessionStorage.removeItem("accesoPermitido");
    location.reload();
  };
</script>

</body>
</html>
